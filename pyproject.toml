[build-system]
requires = ["hatchling>=1.21", "hatch-fancy-pypi-readme>=25"]
build-backend = "hatchling.build"

[project]
name = "webagent-protocol"
dynamic = ["version", "readme"]
description = "WebAgent Protocol: an MCP extension that lets AI agents discover, verify and safely use tools published by any website."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Varad Ganjoo" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "ai-agents",
    "agentic-web",
    "well-known",
    "ed25519",
    "proof-of-work",
    "fastapi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.12",
    "httpx[http2]>=0.27",
    "httpx-sse>=0.4",
    "cryptography>=42",
    "jsonschema>=4.21",
    "typer>=0.15",
    "rich>=13.7",
]

[project.optional-dependencies]
# Business side: WAP endpoints + the same tools as a standard MCP endpoint at /mcp.
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=3.0",
    "mcp>=2,<3",
]
# User side: the wap-mcp bridge for Claude, Cursor, Codex and other MCP hosts.
mcp = [
    "mcp>=2,<3",
]
# Shared state for multi-worker / multi-machine deployments (wap.storage.RedisStore).
redis = [
    "redis>=5",
]
# Optional DNS anchoring of domain keys (_wap.<domain> TXT records).
dns = [
    "dnspython>=2.6",
]
all = [
    "webagent-protocol[server,mcp,redis,dns]",
]
dev = [
    "webagent-protocol[server,mcp,redis]",
    "pytest>=9",
    "hypothesis>=6.140",
    "pytest-asyncio>=1.2",
    "ruff>=0.15",
    "build>=1.3",
]

[project.scripts]
wap = "wap.cli.main:app"
wap-mcp = "wap.mcp.bridge:main"

[project.urls]
Homepage = "https://github.com/varadganjoo/WebAgent-Protocol"
Documentation = "https://github.com/varadganjoo/WebAgent-Protocol#readme"
Specification = "https://github.com/varadganjoo/WebAgent-Protocol/blob/main/docs/spec_rfc.md"
"MCP extension proposal" = "https://github.com/varadganjoo/WebAgent-Protocol/blob/main/docs/mcp_extension.md"
Changelog = "https://github.com/varadganjoo/WebAgent-Protocol/blob/main/CHANGELOG.md"
Issues = "https://github.com/varadganjoo/WebAgent-Protocol/issues"

[tool.hatch.version]
path = "wap/__init__.py"

# The README shows the demo image by relative path, which GitHub renders even while the repo is private.
# PyPI cannot resolve relative paths, so the published description points at the file on GitHub.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'src="(docs/[^"]+)"'
replacement = 'src="https://raw.githubusercontent.com/varadganjoo/WebAgent-Protocol/main/\1"'

[tool.hatch.build.targets.wheel]
packages = ["wap"]

[tool.hatch.build.targets.sdist]
include = ["wap", "docs", "examples", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"examples/benchmark.py" = ["E501"]  # embedded HTML fixture
