[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "wap"
dynamic = ["version"]
description = "WebAgent Protocol (WAP): well-known discovery, signed negotiation and abuse-resistant transport between AI agents on the open web."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "WebAgent Protocol contributors" }]
keywords = ["ai-agents", "protocol", "mcp", "well-known", "ed25519", "proof-of-work", "sse", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "httpx[http2]>=0.27",
    "httpx-sse>=0.4",
    "cryptography>=42",
    "jsonschema>=4.21",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.0",
]
mcp = [
    "mcp>=1.2",
]
all = [
    "wap[server,mcp]",
]
dev = [
    "wap[server,mcp]",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
wap = "wap.cli.main:app"
wap-mcp = "wap.mcp.bridge:main"

[project.urls]
Homepage = "https://github.com/varadganjoo/WebAgent-Protocol"
Specification = "https://github.com/varadganjoo/WebAgent-Protocol/blob/main/docs/spec_rfc.md"
Whitepaper = "https://github.com/varadganjoo/WebAgent-Protocol/blob/main/docs/whitepaper.md"

[tool.hatch.version]
path = "wap/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["wap"]

[tool.hatch.build.targets.sdist]
include = ["wap", "docs", "examples", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "UP007", "UP042", "UP045"]

[tool.ruff.lint.per-file-ignores]
"wap/cli/main.py" = ["UP006"]
"examples/benchmark.py" = ["E501"]  # embedded HTML fixture
