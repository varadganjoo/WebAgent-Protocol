name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Redis (multi-instance tests)
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q
      - name: Test vectors are current and verify in JavaScript
        run: |
          python examples/generate_test_vectors.py --check
          node tests/interop/verify_vectors.mjs docs/test-vectors.json
      - name: Benchmark smoke test
        run: python examples/benchmark.py
      - name: Build package
        run: python -m build
